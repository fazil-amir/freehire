# Serves the built app. Routes such as /schedules exist only in the browser, so a
# path that is not a file falls back to index.html — a reload or a shared link
# lands on the right page instead of a 404.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed file names (assets/index-3f2a.js) never change content: cache for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # config.js is rewritten at every start, and index.html names the current
    # hashed files — both must be re-checked on every load, or a new setting or
    # a new build would not reach anyone until their cache expired.
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
