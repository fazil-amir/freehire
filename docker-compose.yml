services:
  db:
    # pgvector's build, not stock postgres: migration 0092 runs `CREATE EXTENSION
    # vector`, which the stock image doesn't ship. This is Debian-based (bookworm),
    # not Alpine — pgvector has no Alpine variant — but pins the same Postgres major
    # (18) as the stock image it replaces, so the version-subdirectory volume
    # behaviour noted below is unaffected.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: hire
      POSTGRES_PASSWORD: hire
      POSTGRES_DB: hire
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      # postgres:18+ stores data in a version-specific subdirectory and expects
      # the volume at /var/lib/postgresql (not the legacy .../data path, which it
      # now treats as an unused mount and refuses to start).
      - pgdata:/var/lib/postgresql
      # Migrations are applied automatically by Postgres on first volume init.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hire -d hire"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Search backend for GET /api/v1/jobs/search and the reindex command. The
  # huggingFace embedder downloads and runs its model inside this container, so
  # the model is cached in the meilisearch_data volume across restarts.
  meilisearch:
    image: getmeili/meilisearch:v1.49.0
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-dev-insecure-meili-key}"
      MEILI_ENV: development
    ports:
      - "${MEILI_HOST_PORT:-7700}:7700"
    volumes:
      - meilisearch_data:/meili_data

  # Backs the shared rate limiter (internal/ratelimit). A required dependency, not
  # an optional one like Meili — no volume, since rate-limit counters are
  # ephemeral/TTL'd and losing them on restart is a fail-open no-op, not data loss.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local S3-compatible storage for résumé upload (internal/blobstore). Without it
  # `PUT/POST /me/resume` runs with storage disabled (S3_* unset) and callers degrade to
  # the previous per-request extraction — real locally, but no upload persists, so the
  # fit analysis never sees a structured résumé. s3-init creates the bucket once and
  # exits; the app waits on that, not on the server itself, since the bucket must exist
  # first.
  #
  # This was MinIO, pulled from Quay after MinIO deleted the `minio/*` Docker Hub
  # repositories. On 2026-09-24 Quay started refusing those names too — an anonymous pull
  # token gets 401 for both `minio/minio` and `minio/mc`, GHCR answers 403 and Bitnami
  # 404 — so every PR's smoke job failed twelve seconds in, before any code ran. There is
  # no MinIO image left to pin.
  #
  # adobe/s3mock replaces it: an in-memory S3 server, which is all this stack ever wanted
  # — the smoke job never persists anything across a restart. Its documented
  # `initialBuckets` env var does NOT create the bucket in the current image (checked,
  # both spellings), so the bucket is created with a plain PUT, which is also why the
  # init container no longer needs a vendor CLI.
  # Pinned, like every other image in this file. The change that introduced this service
  # exists BECAUSE an unpinned upstream moved out from under the smoke job, and shipping
  # it on `latest` repeated the shape it was fixing.
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      # Path-style addressing, which is what internal/blobstore uses against a custom
      # S3_ENDPOINT. No credentials: s3mock accepts any signature.
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    ports:
      - "${S3_HOST_PORT:-9000}:9090"

  s3-init:
    image: curlimages/curl:8.22.0
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      until curl -sf -o /dev/null -X PUT http://s3:9090/hire-resumes; do sleep 1; done;
      exit 0;
      "

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://hire:hire@db:5432/hire?sslmode=disable"
      # Dev defaults pointing at the local `s3` service above. Prod sets its own
      # S3_* in its .env, pointing at the real bucket — these values never leave Docker.
      S3_ENDPOINT: "${S3_ENDPOINT:-http://s3:9090}"
      S3_BUCKET: "${S3_BUCKET:-hire-resumes}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-s3mock}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-s3mock}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      # PII_FILTER_URL intentionally has no local default: it fronts a real span-detection
      # model (services/pii-filter) with no lightweight local stand-in, so unset here is the
      # correct out-of-the-box state — résumé structuring/import degrade gracefully without
      # it (internal/resumeextract's Enabled() check), same as an unconfigured LLM.
      PII_FILTER_URL: "${PII_FILTER_URL:-}"
      # LLM-backed features (enrich, fit analysis, résumé structuring, the assistant, …)
      # were silently unreachable locally: these were never passed through from .env at
      # all, so every model call degraded as "unconfigured" with no error. Empty is a
      # valid, working default (the same degrade-gracefully behaviour, just intentional
      # now) — set real values in .env to actually exercise a model-backed surface.
      # Catalogue scope (see .env.example): false = every job, true = IT only. The server
      # reads it on the link-import path, which must agree with ingest and the search index
      # about what is searchable — so board-console below gets the SAME expression.
      CATALOGUE_TECH_ONLY: "${CATALOGUE_TECH_ONLY:-false}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      # Optional: the assistant's own model, chosen for tool calling rather than
      # cheap one-shot extraction. Falls back to LLM_MODEL.
      ASSISTANT_MODEL: "${ASSISTANT_MODEL:-}"
      # Bullets allowed per experience or project. Unset (or below 1) means 20.
      # The agent reads the live value into its cv_edit tool description, so
      # raising this needs no prompt change.
      CV_MAX_BULLETS: "${CV_MAX_BULLETS:-}"
      # Fit-analysis sanitize ceilings for untrusted model output (see .env.example).
      # Empty/unset falls back to internal/matchanalysis's own DefaultBounds — these
      # were documented in .env.example but never reached the container, so setting
      # them in .env silently had no effect.
      MATCH_ANALYSIS_MAX_COMMENT_RUNES: "${MATCH_ANALYSIS_MAX_COMMENT_RUNES:-}"
      MATCH_ANALYSIS_MAX_LIST_ITEM_RUNES: "${MATCH_ANALYSIS_MAX_LIST_ITEM_RUNES:-}"
      MATCH_ANALYSIS_MAX_RECOMMEND_RUNES: "${MATCH_ANALYSIS_MAX_RECOMMEND_RUNES:-}"
      MATCH_ANALYSIS_MAX_REQ_TEXT_RUNES: "${MATCH_ANALYSIS_MAX_REQ_TEXT_RUNES:-}"
      MATCH_ANALYSIS_MAX_REQ_EVIDENCE_RUNES: "${MATCH_ANALYSIS_MAX_REQ_EVIDENCE_RUNES:-}"
      MATCH_ANALYSIS_MAX_STRENGTHS: "${MATCH_ANALYSIS_MAX_STRENGTHS:-}"
      MATCH_ANALYSIS_MAX_GAPS: "${MATCH_ANALYSIS_MAX_GAPS:-}"
      MATCH_ANALYSIS_MAX_REQUIREMENTS: "${MATCH_ANALYSIS_MAX_REQUIREMENTS:-}"
      MATCH_ANALYSIS_MAX_SIGNALS: "${MATCH_ANALYSIS_MAX_SIGNALS:-}"
      MATCH_ANALYSIS_MAX_SIGNAL_QUOTE_RUNES: "${MATCH_ANALYSIS_MAX_SIGNAL_QUOTE_RUNES:-}"
      MATCH_ANALYSIS_MAX_SIGNAL_INSIGHT_RUNES: "${MATCH_ANALYSIS_MAX_SIGNAL_INSIGHT_RUNES:-}"
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      # Required by the auth surface (server fails fast if unset or under 32 bytes).
      # Dev default — set a real, random JWT_SECRET in any non-local deployment.
      JWT_SECRET: "${JWT_SECRET:-dev-insecure-secret-change-me-0123456789}"
      # OAuth callbacks redirect the browser back to this origin; it also
      # derives the per-provider callback URL registered at each provider.
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5173}"
      # OAuth sign-in is optional: a provider with empty credentials is simply
      # disabled (no button in the SPA, its routes 404). Set the values in .env.
      OAUTH_GOOGLE_CLIENT_ID: "${OAUTH_GOOGLE_CLIENT_ID:-}"
      OAUTH_GOOGLE_CLIENT_SECRET: "${OAUTH_GOOGLE_CLIENT_SECRET:-}"
      OAUTH_GITHUB_CLIENT_ID: "${OAUTH_GITHUB_CLIENT_ID:-}"
      OAUTH_GITHUB_CLIENT_SECRET: "${OAUTH_GITHUB_CLIENT_SECRET:-}"
      OAUTH_LINKEDIN_CLIENT_ID: "${OAUTH_LINKEDIN_CLIENT_ID:-}"
      OAUTH_LINKEDIN_CLIENT_SECRET: "${OAUTH_LINKEDIN_CLIENT_SECRET:-}"
      OAUTH_APPLE_CLIENT_ID: "${OAUTH_APPLE_CLIENT_ID:-}"
      OAUTH_APPLE_TEAM_ID: "${OAUTH_APPLE_TEAM_ID:-}"
      OAUTH_APPLE_KEY_ID: "${OAUTH_APPLE_KEY_ID:-}"
      OAUTH_APPLE_PRIVATE_KEY: "${OAUTH_APPLE_PRIVATE_KEY:-}"
      # Search is optional: an empty MEILI_MASTER_KEY disables the search
      # endpoint without affecting the rest of the API.
      MEILI_URL: "http://meilisearch:7700"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-dev-insecure-meili-key}"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "${HIRE_HOST_PORT:-8080}:8080"

  # Internal ops tool for managing freehire's board catalog — a fully separate Go
  # module (board-console/go.mod, zero imports of freehire's internal/... packages,
  # no DB access from its own code) that only happens to live in this repo and this
  # compose file so it comes up with `make up`. It drives freehire's own
  # bulk-add-boards/ingest/reindex binaries as LOCAL SUBPROCESSES inside its own
  # container (copied in at build time from the `build` stage above, not
  # recompiled) — never `docker exec` into the `app` container. See
  # board-console/README.md.
  # One-shot, like minio-init: makes board-console/data writable by the
  # board-console container (uid/gid 65532) while it stays owned by — and
  # `git pull`-able for — whoever cloned the repo. Without it a fresh Linux
  # server crashes board-console on start with "permission denied" (Docker
  # Desktop on macOS never enforces this). It changes only the GROUP and group
  # bits, never the owner; runs on every `make up` and is a no-op once set.
  board-console-init:
    image: alpine:3.20
    volumes:
      - ./board-console/data:/data
    command: >
      sh -c "chgrp -R 65532 /data && chmod -R g+rwX,o+rX /data && chmod g+s /data"

  # board-console's only way to Docker: the Server card reads the build cache's
  # size and "Clear build cache" prunes it. The raw socket is full control of the
  # host, so board-console never gets it — this proxy lets through only what the
  # sections below allow: SYSTEM (GET /system/df) and BUILD with POST (/build/prune;
  # /build itself could also build an image, but nothing here can run a container,
  # exec, or touch volumes or networks). No published port: reachable from the
  # compose network only.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      SYSTEM: 1
      BUILD: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  board-console:
    build:
      context: .
      target: board-console
    depends_on:
      board-console-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # meilisearch has no healthcheck defined (see the service above), so this
      # only waits for it to start, the same as the app service already does.
      meilisearch:
        condition: service_started
      # Its only way to Docker (the Server card's build cache): started with it,
      # so bringing board-console up alone never leaves the card "not reachable".
      docker-proxy:
        condition: service_started
    environment:
      PORT: "8091"
      DATABASE_URL: "postgres://hire:hire@db:5432/hire?sslmode=disable"
      MEILI_URL: "http://meilisearch:7700"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-dev-insecure-meili-key}"
      REDIS_URL: "redis://redis:6379/0"
      # Where reindex's disk-guard measures free space before a swap-rebuild
      # (cmd/reindex/diskguard.go). It must be the volume Meilisearch stores its
      # indexes on — mounted read-only below — or the guard can't measure and
      # skips itself with a warning on every run.
      MEILI_DATA_DIR: "/var/lib/freehire/meili"
      # The free-space floor (GiB) below which that guard refuses a rebuild. A
      # rebuild briefly holds a second copy of the index, so this only needs to
      # clear the index's size with headroom. freehire's 70 GiB default is sized
      # for its own multi-million-job index; this catalogue's is far smaller.
      # Raise it as the index grows (check: du -sh /meili_data in meilisearch).
      REINDEX_MIN_FREE_GB: "${REINDEX_MIN_FREE_GB:-20}"
      # Must match the app's value above: every ingest/reindex/recount board-console runs
      # inherits it, and a crawl that disagrees with the site about what belongs in the
      # catalogue stores (or drops) the wrong jobs. Override both at once from .env.
      CATALOGUE_TECH_ONLY: "${CATALOGUE_TECH_ONLY:-false}"
      # "Explain this run" (POST /api/v1/runs/{id}/explain). Put the key in .env (never
      # in this file); unset makes it answer 503. OPENAI_MODEL defaults to
      # gpt-4o-mini; OPENAI_BASE_URL points at an OpenAI-compatible gateway.
      # How many scheduled crawls may run at the same time: the Schedules page
      # plans every provider's times around it. Unset (or unreadable) means 2.
      SCHEDULE_CAPACITY: "${SCHEDULE_CAPACITY:-2}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      # The Server card's build-cache figure and its Clear button (see docker-proxy).
      # Set it empty in .env to turn both off.
      DOCKER_PROXY_URL: "${DOCKER_PROXY_URL-http://docker-proxy:2375}"
      # The JSON API (/api/v1) a separate UI drives. A set key is required as
      # "Authorization: Bearer <key>"; unset leaves the API open — local use only.
      # CORS_ORIGINS lists the browser origins allowed to call it (comma list).
      BOARD_CONSOLE_API_KEY: "${BOARD_CONSOLE_API_KEY:-}"
      BOARD_CONSOLE_CORS_ORIGINS: "${BOARD_CONSOLE_CORS_ORIGINS:-http://localhost:5173}"
    ports:
      # Host port 8040 (8091 clashes with Beszel). Override with BOARD_CONSOLE_HOST_PORT.
      - "${BOARD_CONSOLE_HOST_PORT:-8040}:8091"
    volumes:
      # board-console's only persistent store, kept on the host across rebuilds. Only
      # combined_boards.csv is in git; activity/schedule/system are per machine
      # (git-ignored). Write access for the container (uid 65532) is set up by
      # board-console-init above.
      - ./board-console/data:/app/data
      # Read-only: only statfs'd by reindex's disk-guard (see MEILI_DATA_DIR),
      # never written — Meilisearch itself is the volume's only writer.
      - meilisearch_data:/var/lib/freehire/meili:ro

  # SvelteKit SSR frontend. nginx (:80) fronts both the Node SSR server and the
  # Go API, keeping them same-origin for the auth cookie. The browser talks only
  # to this container.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      # Public origin for canonical/sitemap/JSON-LD — match the host-facing URL.
      ORIGIN: "${WEB_ORIGIN:-http://localhost:8090}"
      # The Node SSR server fetches the Go API server-to-server (never relative).
      API_INTERNAL_URL: "http://app:8080"
    ports:
      - "${WEB_HOST_PORT:-8090}:80"
    depends_on:
      - app

volumes:
  pgdata:
  meilisearch_data:
