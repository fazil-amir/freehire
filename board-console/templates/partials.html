{{define "nav"}}
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Board Console</div>
    <nav>
      <a href="/" class="{{if eq .Active "catalog"}}active{{end}}">Catalog</a>
      <a href="/schedules" class="{{if eq .Active "schedules"}}active{{end}}">Schedules</a>
      <a href="/activity" class="{{if eq .Active "activity"}}active{{end}}">Activity</a>
    </nav>
    <form method="post" action="/logout" class="logout-form">
      <button type="submit" aria-label="Log out" title="Log out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </form>
  </div>
</header>
{{end}}

{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Console</title>
<link rel="stylesheet" href="/static/style.css">
{{end}}

{{/* The close (×) button every dialog header carries — app.js closes the
     enclosing <dialog> for any [data-dialog-close]. */}}
{{define "dialog-close"}}
<button type="button" class="dialog-close" data-dialog-close aria-label="Close">×</button>
{{end}}
